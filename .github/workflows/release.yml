# 自动发布：app/__init__.py 里的 VERSION 改大并推送到 main 分支后，
# GitHub 会自动打包三个安装包和更新包，并创建对应版本的 Release（如 v1.5.0）。
# 软件里的“检查更新”读取的就是最新 Release 里的 latest.json。
# 也可以在仓库的 Actions 页面手动运行，或推送 v 开头的标签触发。
name: 发布新版本

on:
  push:
    branches: [main]
    paths: ['app/__init__.py']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 读取版本号，检查是否已经发布过
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import re;print(re.search(r\"VERSION = '([^']+)'\", open('app/__init__.py', encoding='utf-8').read()).group(1))")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$V 已经发布过，跳过"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 语法检查
        if: steps.ver.outputs.skip != '1'
        run: python3 -m compileall -q app start.py tools/build.py

      - name: 单元测试
        if: steps.ver.outputs.skip != '1'
        run: python3 -m unittest discover

      - name: 打包
        if: steps.ver.outputs.skip != '1'
        run: python3 tools/build.py --release --only update,win10,win7,mac

      - name: 创建 Release 并上传文件
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/release/* --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" --notes-file dist/release-notes.md --latest
