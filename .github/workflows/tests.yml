# 自动测试：推送到任何分支、提交 Pull Request 时运行核心计算的单元测试。
# 同时在 Python 3.8（Windows 7 版使用的版本）和较新的 Python 上运行，保证代码兼容 3.8。
name: 测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: '3.8' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: windows-latest, python: '3.8' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法检查
        run: python -m compileall -q app start.py tools/build.py tools/desktop_smoke.py tests

      - name: 单元测试
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -v

  # 独立桌面窗口：打包后用安装包自带的 Python 真的打开窗口，确认页面正常运行后自动关闭
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, kind: win10 }
          - { os: macos-latest, kind: mac }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 打开独立窗口自动测试
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/desktop_smoke.py ${{ matrix.kind }}


  # Mac 版：像用户双击一样用 open 打开 .app，检查独立窗口（包括“从网上下载”的隔离标记）
  mac-open:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ['', quarantine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 双击打开测试 ${{ matrix.mode }}
        run: bash tools/mac/open_test.sh ${{ matrix.mode }}
      - name: 截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-open-${{ matrix.mode || 'plain' }}
          path: ${{ runner.temp }}/mac-open.png
          if-no-files-found: ignore
